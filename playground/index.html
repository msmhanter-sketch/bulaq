<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butaq Тілінің Интерактивті Алаңы (Interactive Playground)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-icon">🌱</span>
                <h1>Butaq <span class="accent">Playground</span></h1>
            </div>
            <div class="controls">
                <div class="select-wrapper">
                    <select id="examples-dropdown">
                        <option value="hello">Сәлем, Әлем!</option>
                        <option value="math">Математика</option>
                        <option value="loop">Цикл (әзірше)</option>
                        <option value="func">Функция</option>
                        <option value="struct">Құрылымдар (Structs)</option>
                    </select>
                </div>
                <button id="run-btn" class="glow-on-hover">
                    <span class="btn-icon">▶</span> Іске қосу
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main>
            <!-- Code Editor Section -->
            <section class="editor-section card">
                <div class="card-header">
                    <h2>📝btq Код редакторы</h2>
                    <span class="status-indicator" id="compiler-status">Жүктелуде...</span>
                </div>
                <div class="editor-container">
                    <div class="line-numbers" id="line-numbers">1</div>
                    <textarea id="code-editor" spellcheck="false" placeholder="# Осында Butaq кодын жазыңыз..."></textarea>
                </div>
            </section>

            <!-- Results Section -->
            <section class="results-section card">
                <div class="card-header tab-header">
                    <button class="tab-btn active" data-tab="output">Нәтиже (Output)</button>
                    <button class="tab-btn" data-tab="llvm">LLVM IR</button>
                    <button class="tab-btn" data-tab="nasm">NASM Assembly</button>
                </div>
                <div class="tab-contents">
                    <div class="tab-pane active" id="output-pane">
                        <pre id="output-console" class="console-output">Бағдарлама нәтижесі осында шығады...</pre>
                    </div>
                    <div class="tab-pane" id="llvm-pane">
                        <pre id="llvm-console" class="code-output">Генерацияланған LLVM IR коды...</pre>
                    </div>
                    <div class="tab-pane" id="nasm-pane">
                        <pre id="nasm-console" class="code-output">Генерацияланған NASM ассемблер коды...</pre>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="wasm_exec.js"></script>
    <script src="app.js"></script>
</body>
</html>
